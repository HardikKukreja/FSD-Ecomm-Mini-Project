services:
  # ─── Backend API ───────────────────────────────────────────────────────────
  - type: web
    name: shopsphere-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false          # You'll set this manually in Render dashboard
      - key: JWT_SECRET
        sync: false          # You'll set this manually in Render dashboard
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false          # Set to your Render static site URL after deploying

  # ─── Frontend Static Site ──────────────────────────────────────────────────
  - type: web
    name: shopsphere-client
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    rootDir: ./client
    envVars:
      - key: VITE_API_URL
        sync: false          # Set to your shopsphere-api Render URL
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

